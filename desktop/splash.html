<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Намаз</title>
<style>
  :root { --gold: #d4af37; --gold-light: #f7e8a4; --bg: #06281f; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-app-region: drag; }
  html, body { height: 100%; }
  body {
    overflow: hidden; user-select: none; cursor: default;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: #f0f5f1;
    background: radial-gradient(120% 90% at 50% 0%, #0a3a2c 0%, var(--bg) 48%, #02120d 100%);
    transition: opacity .45s ease, transform .45s ease, filter .45s ease;
  }
  body.hide { opacity: 0; transform: scale(1.05); filter: blur(12px); }
  .glow { position: fixed; border-radius: 50%; filter: blur(60px); pointer-events: none; }
  .g1 { width: 60vmax; height: 60vmax; left: -16vmax; top: -22vmax; background: radial-gradient(circle, rgba(212,175,55,.26), transparent 62%); animation: breath 7s ease-in-out infinite; }
  .g2 { width: 50vmax; height: 50vmax; right: -14vmax; bottom: -20vmax; background: radial-gradient(circle, rgba(34,197,94,.20), transparent 62%); animation: breath 9s ease-in-out infinite reverse; }
  @keyframes breath { 0%,100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.14); opacity: .68; } }
  .rays { position: fixed; inset: -30%; pointer-events: none; background: repeating-conic-gradient(from 0deg, rgba(212,175,55,.05) 0deg 1.5deg, transparent 1.5deg 22.5deg); -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 62%); mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 62%); animation: spin 90s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dust i { position: fixed; bottom: -4vh; border-radius: 50%; background: var(--gold-light); box-shadow: 0 0 6px rgba(212,175,55,.8); opacity: 0; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: .7; } 88% { opacity: .4; } 100% { transform: translateY(-108vh) translateX(var(--dx,0)); opacity: 0; } }
  .wrap { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; -webkit-app-region: drag; }
  svg.emblem { width: 116px; height: 116px; overflow: visible; margin-bottom: 8px; }
  .star { transform-origin: 60px 60px; animation: spin 44s linear infinite; }
  .star rect { stroke-dasharray: 224; stroke-dashoffset: 224; animation: draw 1.8s .25s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .moon { opacity: 0; transform-origin: 60px 60px; animation: moon 1.3s .65s cubic-bezier(.2,.8,.2,1) forwards, pulse 3.6s 2.2s ease-in-out infinite; }
  @keyframes moon { from { opacity: 0; transform: scale(.55) rotate(-24deg); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .82; } }
  .title { font-size: 34px; font-weight: 800; letter-spacing: .34em; text-indent: .34em; margin-top: 6px;
    background: linear-gradient(100deg, var(--gold) 10%, var(--gold-light) 45%, var(--gold) 75%); background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 3.2s linear infinite, up 1s .5s both; }
  @keyframes shimmer { to { background-position: -220% 0; } }
  .rule { height: 1px; width: 0; margin: 12px 0 16px; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: rule 1.2s .85s ease forwards; }
  @keyframes rule { to { width: 220px; } }
  .ayah { font-family: 'Amiri','Scheherazade New','Traditional Arabic','Times New Roman',serif; font-size: 22px; line-height: 1.9; direction: rtl; color: var(--gold-light); text-shadow: 0 0 24px rgba(212,175,55,.35); animation: blur 1.5s 1.2s both; }
  @keyframes blur { from { opacity: 0; transform: translateY(10px); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .tr { margin-top: 12px; font-size: 13px; opacity: .9; max-width: 34ch; line-height: 1.5; animation: up 1s 1.9s both; }
  .src { margin-top: 8px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); animation: up 1s 2.1s both; }
  .bar { width: 170px; height: 2px; margin-top: 22px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; animation: up .8s 2.3s both; }
  .bar i { display: block; height: 100%; width: 45%; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); animation: scan 1.2s ease-in-out infinite; }
  @keyframes scan { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .dust, .rays { display: none; } .star rect { stroke-dashoffset: 0; } .moon, .title, .ayah, .tr, .src, .bar, .rule { opacity: 1; transform: none; filter: none; } .rule { width: 220px; } }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="rays"></div>
  <div class="dust" id="dust"></div>
  <div class="wrap">
    <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e8a4"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#9c7a1e"/></linearGradient>
        <filter id="glowF" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <mask id="moonMask"><rect width="120" height="120" fill="#fff"/><circle cx="70" cy="54" r="24" fill="#000"/></mask>
      </defs>
      <g class="star" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity=".85">
        <rect x="32" y="32" width="56" height="56"/>
        <rect x="32" y="32" width="56" height="56" transform="rotate(45 60 60)"/>
      </g>
      <circle class="moon" cx="60" cy="60" r="27" fill="url(#gold)" mask="url(#moonMask)" filter="url(#glowF)"/>
      <circle class="moon" cx="84" cy="40" r="2.4" fill="#f7e8a4"/>
    </svg>
    <div class="title">НАМАЗ</div>
    <div class="rule"></div>
    <div class="ayah">إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا</div>
    <div class="tr">Поистине, молитва предписана верующим в определённое время.</div>
    <div class="src">Ан-Ниса · 4:103</div>
    <div class="bar"><i></i></div>
  </div>
<script>
  (function () {
    if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      var d = document.getElementById('dust');
      for (var i = 0; i < 16; i++) {
        var p = document.createElement('i');
        var s = 2 + Math.random() * 3;
        p.style.left = (Math.random() * 100) + '%';
        p.style.width = s + 'px'; p.style.height = s + 'px';
        p.style.setProperty('--dx', ((Math.random() * 2 - 1) * 50) + 'px');
        p.style.animationDuration = (7 + Math.random() * 9) + 's';
        p.style.animationDelay = (-Math.random() * 12) + 's';
        d.appendChild(p);
      }
    }
    // main.js вызывает это перед закрытием окна для плавного handoff
    window.__splashHide = function () { document.body.classList.add('hide'); };
  })();
</script>
</body>
</html>
