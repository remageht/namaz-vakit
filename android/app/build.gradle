apply plugin: 'com.android.application'

android {
    namespace 'com.remageht.namazvakit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.remageht.namazvakit'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
