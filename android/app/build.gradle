apply plugin: 'com.android.application'

android {
    namespace 'com.remageht.namazvakit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.remageht.namazvakit'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.9.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
